# Weekly pull requests for outdated dependencies, so a published security hole
# gets a fix PR instead of going unnoticed. Minor and patch updates come grouped
# in one PR; major updates come one at a time because they can break things.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
