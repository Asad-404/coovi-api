name: Deploy

on:
  push:
    branches: [master]

concurrency:
  group: deploy-api
  cancel-in-progress: true

permissions:
  contents: read
  packages: write   # needed to push to ghcr.io

jobs:
  build-and-deploy:
    name: Build → Push → Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/asad-404/coovi-api:latest
          # Layer cache stored in GHCR — subsequent builds reuse unchanged layers
          cache-from: type=registry,ref=ghcr.io/asad-404/coovi-api:buildcache
          cache-to:   type=registry,ref=ghcr.io/asad-404/coovi-api:buildcache,mode=max

      - name: Deploy to Lightsail
        uses: appleboy/ssh-action@v1
        with:
          host:     ${{ secrets.VPS_HOST }}
          username: deploy
          key:      ${{ secrets.VPS_SSH_KEY }}
          script: |
            /home/deploy/coovi/scripts/deploy.sh api
